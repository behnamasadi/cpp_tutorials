name: ubuntu-24.04

on:
  push:
    branches: [master]
    tags:
      - v*.*.*
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Build the Docker image
        run: docker build . --file Dockerfile --tag mycpp_image:latest

      - name: Verify the toolchain in the image
        run: docker run --rm mycpp_image:latest sh -c "cmake --version && ninja --version && doxygen --version"

      - name: Configure CMake
        run: docker run --rm -v "${{ github.workspace }}:/cpp_tutorials" mycpp_image:latest cmake --preset ninja-multi

      - name: Build with CMake
        run: docker run --rm -v "${{ github.workspace }}:/cpp_tutorials" mycpp_image:latest cmake --build --preset ninja-multi-release

      - name: Generate Doxygen documentation
        run: docker run --rm -v "${{ github.workspace }}:/cpp_tutorials" mycpp_image:latest doxygen Doxyfile

      - name: Upload documentation
        uses: actions/upload-artifact@v7
        with:
          name: cpp_documentation
          path: docs/html
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download documentation
        uses: actions/download-artifact@v8
        with:
          name: cpp_documentation
          path: html

      - name: Zip documentation
        run: zip -qr "cpp_tutorials_docs_${{ github.ref_name }}.zip" html

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: cpp_tutorials_docs_${{ github.ref_name }}.zip
